services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: demo
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
    ports: ["5432:5432"]

  kafka:
    image: apache/kafka:3.9.0   # single-node KRaft, advertises localhost:9092
    ports: ["9092:9092"]

  # Apps send traces here (OTLP), collector forwards to Jaeger
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.115.1
    command: ["--config=/etc/otel.yaml"]
    volumes: ["./otel-collector.yaml:/etc/otel.yaml"]
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    depends_on: [jaeger]

  # Trace UI -> http://localhost:16686
  jaeger:
    image: jaegertracing/all-in-one:1.64.0
    ports: ["16686:16686"]
